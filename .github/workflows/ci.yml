name: OpenCode Windows plugin
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install development dependencies
        run: npm ci --ignore-scripts
      - name: Build reference settings extension
        run: npm run build
      - name: OpenCode adapter contracts
        run: npm test
      - name: Settings browser interaction and layout
        run: npm run test:ui
      - name: Shared backend contracts
        run: node test/run-upstream-selected.mjs --powershell=pwsh.exe source-encoding lazy-tools overlay-strings atomic-json batch-browser progress-overlay browser-namespace browser-transport
        timeout-minutes: 10
      - name: Screenshot transport fixtures
        run: node test/screenshot-output.mjs
      - name: Native batch fixtures
        run: node test/batch-actions.mjs
      - name: Build distributable package
        run: npm pack
      - name: Install packaged plugin without development dependencies
        shell: pwsh
        run: |
          $package = Get-ChildItem -Path opencode-computer-use-win-*.tgz | Select-Object -First 1
          npm install --prefix .work/package-consumer --omit=dev --ignore-scripts --no-audit --no-fund $package.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node test/package-smoke.mjs
      - name: Upload installable plugin
        uses: actions/upload-artifact@v4
        with:
          name: opencode-computer-use-win
          path: opencode-computer-use-win-*.tgz
          if-no-files-found: error
      - name: Preserve settings screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-settings
          path: .work/validation/*.png
          if-no-files-found: warn
